<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - SEWAMITRA</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div id="page"></div>
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/app.js"></script>
  <script>
    let activeChatId = null;
    let contacts = [];
    let pollTimer = null;

    (async function() {
      const ok = await initPage('messages');
      if (!ok) return;

      const params = new URLSearchParams(window.location.search);
      const initialUid = params.get('uid');

      await loadContacts();
      if (initialUid) {
        openChat(parseInt(initialUid));
      }

      pollTimer = setInterval(() => {
        if (activeChatId) loadMessages(activeChatId, true);
      }, 5000);
    })();

    async function loadContacts() {
      try {
        contacts = await API('messages/contacts');
      } catch { contacts = []; }

      const el = document.getElementById('page');
      let html = `
        <div class="container">
          <div class="page-title">Messages</div>
          <div class="grid" style="grid-template-columns:280px 1fr;gap:16px;">
            <div class="card" style="padding:0;overflow:hidden;">
              <div style="padding:12px;border-bottom:1px solid var(--neutral-200);">
                <input type="text" id="newChatInput" placeholder="Enter user ID to chat..." style="width:100%;padding:8px;border:1px solid var(--neutral-300);border-radius:6px;">
                <button class="btn btn-primary btn-sm btn-block mt-8" onclick="startNewChat()">Start Chat</button>
              </div>
              <div id="contactsList" style="max-height:400px;overflow-y:auto;">
      `;
      if (contacts.length) {
        html += contacts.map(c => `
          <div class="flex-row" style="padding:12px;cursor:pointer;border-bottom:1px solid var(--neutral-100);${activeChatId === c.other_id ? 'background:var(--primary-light);' : ''}" onclick="openChat(${c.other_id})">
            <div style="width:36px;height:36px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-weight:600;">${c.other_name.charAt(0)}</div>
            <div>
              <div style="font-weight:600;font-size:0.85rem;">${c.other_name}</div>
              <div class="text-sm text-muted">${c.other_role}</div>
            </div>
          </div>
        `).join('');
      } else {
        html += '<div class="empty-state" style="padding:20px;"><p class="text-sm text-muted">No conversations yet.</p></div>';
      }
      html += `
              </div>
            </div>
            <div class="card" style="padding:0;overflow:hidden;display:flex;flex-direction:column;height:500px;">
              <div id="chatHeader" style="padding:12px;border-bottom:1px solid var(--neutral-200);font-weight:600;display:flex;justify-content:space-between;align-items:center;">
                <div id="chatTitle">Select a contact to start chatting</div>
                <div>
                  <button id="callBtn" class="btn btn-outline btn-sm" style="display:none;margin-left:8px;" onclick="startCall()">Call</button>
                </div>
              </div>
              <div id="chatMessages" class="message-list" style="flex:1;overflow-y:auto;padding:12px;"></div>
              <div id="chatInput" style="padding:12px;border-top:1px solid var(--neutral-200);display:none;">
                <div class="flex-row">
                  <input type="text" id="msgInput" placeholder="Type a message..." style="flex:1;padding:8px 12px;border:1px solid var(--neutral-300);border-radius:6px;" onkeydown="if(event.key==='Enter')sendMessage()">
                  <button class="btn btn-primary btn-sm" onclick="sendMessage()">Send</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
      el.innerHTML += html;
    }

    async function startNewChat() {
      const uid = parseInt(document.getElementById('newChatInput').value);
      if (!uid) return;
      openChat(uid);
    }

    async function openChat(userId) {
      activeChatId = userId;
      try {
        const profile = await API('profile/' + userId);
        document.getElementById('chatTitle').textContent = profile.user.name + ' (' + profile.user.role + ')';
        document.getElementById('callBtn').style.display = 'inline-block';
      } catch {
        document.getElementById('chatTitle').textContent = 'User #' + userId;
        document.getElementById('callBtn').style.display = 'none';
      }
      document.getElementById('chatInput').style.display = 'block';
      await loadMessages(userId);
      // Refresh contacts to show new chat
      await loadContacts();
      document.getElementById('chatInput').style.display = 'block';
    }

    async function loadMessages(userId, silent) {
      try {
        const msgs = await API('messages/' + userId);
        const el = document.getElementById('chatMessages');
        if (!el) return;
        if (!msgs.length) {
          el.innerHTML = '<div class="empty-state"><p class="text-sm text-muted">No messages yet. Say hello!</p></div>';
          return;
        }
        el.innerHTML = msgs.map(m => `
          <div class="message-bubble ${m.sender_id === currentUser.id ? 'sent' : 'received'}">
            ${m.content}
            <div class="message-time">${fmtDate(m.created_at)}</div>
          </div>
        `).join('');
        if (!silent) el.scrollTop = el.scrollHeight;
      } catch {}
    }

    async function sendMessage() {
      const input = document.getElementById('msgInput');
      const content = input.value.trim();
      if (!content || !activeChatId) return;
      input.value = '';
      try {
        await API('messages', {
          method: 'POST',
          body: JSON.stringify({ receiver_id: activeChatId, content })
        });
        await loadMessages(activeChatId, true);
      } catch (e) { toast(e.message, 'error'); }
    }

    // --- Call feature (simulated in-page call UI) ---
    let callState = {
      timer: null,
      seconds: 0,
      connected: false,
      muted: false,
      autoConnectTimeout: null
    };

    function formatTimer(s) {
      const mm = String(Math.floor(s/60)).padStart(2,'0');
      const ss = String(s%60).padStart(2,'0');
      return mm + ':' + ss;
    }

    function showCallOverlay({name, phone, outgoing=true}) {
      const o = document.getElementById('callOverlay');
      if (!o) return;
      document.getElementById('callName').textContent = name || 'Unknown';
      document.getElementById('callPhone').textContent = phone || '';
      document.getElementById('callStatus').textContent = outgoing ? 'Calling…' : 'Incoming call…';
      document.getElementById('callAccept').style.display = outgoing ? 'none' : 'inline-block';
      document.getElementById('callDecline').textContent = outgoing ? 'Cancel' : 'Decline';
      document.getElementById('callControls').style.display = 'none';
      document.getElementById('callTimer').textContent = '00:00';
      callState.connected = false;
      callState.seconds = 0;
      callState.muted = false;
      o.style.display = 'flex';

      // auto-connect simulation for outgoing calls
      if (outgoing) {
        clearTimeout(callState.autoConnectTimeout);
        callState.autoConnectTimeout = setTimeout(() => {
          connectCall();
        }, 3000);
      }
    }

    function hideCallOverlay() {
      const o = document.getElementById('callOverlay');
      if (!o) return;
      o.style.display = 'none';
      clearInterval(callState.timer);
      clearTimeout(callState.autoConnectTimeout);
      callState.connected = false; callState.seconds = 0; callState.muted = false;
    }

    function connectCall() {
      callState.connected = true;
      document.getElementById('callStatus').textContent = 'Connected';
      document.getElementById('callControls').style.display = 'flex';
      document.getElementById('callAccept').style.display = 'none';
      // start timer
      clearInterval(callState.timer);
      callState.timer = setInterval(() => {
        callState.seconds += 1;
        document.getElementById('callTimer').textContent = formatTimer(callState.seconds);
      }, 1000);
    }

    function toggleMute() {
      callState.muted = !callState.muted;
      document.getElementById('callMute').textContent = callState.muted ? 'Unmute' : 'Mute';
    }

    function endCall(reason) {
      // optionally log the call via API
      hideCallOverlay();
      if (reason) toast(reason, 'info');
    }

    async function startCall() {
      if (!activeChatId) return toast('No active chat', 'error');
      try {
        const profile = await API('profile/' + activeChatId);
        const phone = (profile.user && profile.user.phone) ? profile.user.phone : '';
        showCallOverlay({name: profile.user.name, phone, outgoing: true});
      } catch (e) { toast('Unable to start call', 'error'); }
    }

    function acceptCall() {
      connectCall();
    }

    function declineCall() {
      endCall('Call ended');
    }
  </script>
  <div id="callOverlay" style="display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:rgba(0,0,0,0.45);z-index:9999;">
    <div style="background:#fff;padding:18px;border-radius:12px;min-width:320px;max-width:420px;box-shadow:0 12px 32px rgba(0,0,0,0.25);margin:auto;text-align:center;">
      <div style="font-weight:700;font-size:1.1rem;margin-bottom:6px;" id="callName">Caller</div>
      <div id="callPhone" class="text-sm text-muted" style="margin-bottom:10px"></div>
      <div id="callStatus" style="margin-bottom:12px;color:var(--neutral-600)">Calling…</div>
      <div id="callAccept" style="margin-bottom:10px;">
        <button class="btn btn-primary btn-sm" onclick="acceptCall()">Answer</button>
        <button class="btn btn-outline btn-sm" onclick="declineCall()">Decline</button>
      </div>
      <div id="callControls" style="display:none;align-items:center;justify-content:center;gap:8px;">
        <div style="display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:8px;">
          <div id="callTimer" class="text-sm">00:00</div>
        </div>
        <div style="display:flex;align-items:center;justify-content:center;gap:8px;">
          <button id="callMute" class="btn btn-outline btn-sm" onclick="toggleMute()">Mute</button>
          <button class="btn btn-danger btn-sm" onclick="endCall('Call ended')">End</button>
        </div>
      </div>
      <div style="margin-top:8px;text-align:right;">
        <button class="btn btn-ghost btn-sm" onclick="hideCallOverlay()">Close</button>
      </div>
    </div>
  </div>
</body>
</html>

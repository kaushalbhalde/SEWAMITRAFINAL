<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobs - SEWAMITRA</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div id="page"></div>
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/app.js"></script>
  <script>
    let categories = [];
    (async function() {
      const ok = await initPage('jobs', ['customer', 'worker', 'service-team', 'admin']);
      if (!ok) return;
      categories = await API('job-categories');
      const jobsRes = await API('jobs');

      document.getElementById('page').innerHTML += `
        <div class="container">
          <div class="page-title">${currentUser.role === 'customer' ? 'My Posted Jobs' : 'Available Jobs'}</div>
          ${currentUser.role === 'customer' ? `<button class="btn btn-primary mb-16" onclick="openJobModal()">+ Post a Job</button>` : ''}

          ${(currentUser.role === 'worker' || currentUser.role === 'service-team') ? `
          <div class="card mb-16">
            <div class="form-group" style="margin:0;">
              <label>Filter by Category</label>
              <select id="catFilter" onchange="filterJobs()">
                <option value="">All Categories</option>
                ${categories.map(c => `<option value="${c.name}">${c.icon} ${c.name}</option>`).join('')}
              </select>
            </div>
          </div>` : ''}

          <div id="jobsList"></div>
        </div>

        ${currentUser.role === 'customer' ? `
        <div class="modal-overlay" id="jobModal">
          <div class="modal">
            <button class="modal-close" onclick="closeModal('jobModal')">&times;</button>
            <h2>Post a New Job</h2>
            <form id="jobForm">
              <div class="form-group"><label>Job Title</label><input type="text" id="jobTitle" required placeholder="e.g. Need electrician"></div>
              <div class="form-group"><label>Category</label><select id="jobCategory">${categories.map(c => `<option value="${c.name}">${c.icon} ${c.name}</option>`).join('')}</select></div>
              <div class="form-group"><label>Description</label><textarea id="jobDesc" placeholder="Describe the work..."></textarea></div>
              <div class="grid grid-2">
                <div class="form-group"><label>Budget (₹)</label><input type="number" id="jobBudget" placeholder="e.g. 2000"></div>
                <div class="form-group"><label>Workers Needed</label><input type="number" id="jobNumWorkers" value="1" min="1"></div>
              </div>
              <div class="form-group"><label>Location</label><input type="text" id="jobLocation" placeholder="Area or address"></div>
              <button type="submit" class="btn btn-primary btn-block">Post Job</button>
            </form>
          </div>
        </div>` : ''}
      `;

      window.allJobs = jobsRes;
      renderJobs(jobsRes);
    })();

    function renderJobs(jobs) {
      const el = document.getElementById('jobsList');
      if (!jobs.length) {
        el.innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>No jobs found.</p></div>';
        return;
      }
      el.innerHTML = jobs.map(j => `
        <div class="card job-item">
          <div class="flex-between">
            <div>
              <h3>${j.title}</h3>
              <div class="job-meta">
                <span>📂 ${j.category}</span>
                <span>👥 ${j.num_workers} worker(s)</span>
                <span>${statusBadge(j.status)}</span>
                ${j.customer_name ? `<span>👤 ${j.customer_name}</span>` : ''}
              </div>
              ${j.description ? `<p class="text-sm text-muted">${j.description}</p>` : ''}
              ${j.location ? `<p class="text-sm text-muted">📍 ${j.location}</p>` : ''}
            </div>
            <div class="text-right">
              <div class="job-budget">${j.budget ? fmtMoney(j.budget) : 'Negotiable'}</div>
              <button class="btn btn-sm btn-primary mt-8" onclick="viewJob(${j.id})">${currentUser.role === 'customer' ? 'Manage' : 'View & Apply'}</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterJobs() {
      const cat = document.getElementById('catFilter').value;
      const filtered = cat ? allJobs.filter(j => j.category === cat) : allJobs;
      renderJobs(filtered);
    }

    function viewJob(id) { window.location.href = '/job-detail.html?id=' + id; }
    function openJobModal() { document.getElementById('jobModal').classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    document.addEventListener('submit', async e => {
      if (e.target.id !== 'jobForm') return;
      e.preventDefault();
      try {
        await API('jobs', {
          method: 'POST',
          body: JSON.stringify({
            title: document.getElementById('jobTitle').value,
            category: document.getElementById('jobCategory').value,
            description: document.getElementById('jobDesc').value,
            budget: parseFloat(document.getElementById('jobBudget').value) || null,
            num_workers: parseInt(document.getElementById('jobNumWorkers').value) || 1,
            location: document.getElementById('jobLocation').value
          })
        });
        closeModal('jobModal');
        toast('Job posted!', 'success');
        setTimeout(() => window.location.reload(), 800);
      } catch (err) { toast(err.message, 'error'); }
    });
  </script>
</body>
</html>

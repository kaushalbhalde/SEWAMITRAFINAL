<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEWAMITRA — Connecting Communities with Local Workers</title>
  <meta name="description" content="SEWAMITRA is India's trusted platform connecting customers with verified local workers. Find skilled workers for any job, safe and simple.">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    /* ── Landing-specific styles ── */
    .lp-nav {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
    }
    .lp-logo {
      font-family: 'Outfit', 'Inter', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      color: white;
      letter-spacing: -0.03em;
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .lp-logo-dot { color: #34d399; }
    .lp-logo-badge {
      font-size: 0.6rem;
      font-weight: 700;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.9);
      padding: 3px 8px;
      border-radius: 999px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .lp-nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .lp-nav-links a {
      color: rgba(255,255,255,0.8);
      font-size: 0.9rem;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.18s ease, color 0.18s ease;
    }
    .lp-nav-links a:hover { background: rgba(255,255,255,0.1); color: white; }
    .lp-nav-links .btn-nav {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      backdrop-filter: blur(8px);
    }
    .lp-nav-links .btn-nav:hover { background: rgba(255,255,255,0.25); }
    .lp-nav-links .btn-nav-primary {
      background: linear-gradient(135deg, #0d9488, #6366f1);
      color: white;
      border: none;
      box-shadow: 0 4px 18px rgba(13,148,136,0.4);
    }
    .lp-nav-links .btn-nav-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(13,148,136,0.5); }

    /* Hero */
    .lp-hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #070d1a;
    }
    .lp-slideshow { position: absolute; inset: 0; }
    .lp-slide {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      opacity: 0;
      transform: scale(1.04);
      transition: opacity 1.4s ease-in-out, transform 8s ease-out;
    }
    .lp-slide.active { opacity: 1; transform: scale(1); }
    .lp-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(135deg,
        rgba(7,13,26,0.88) 0%,
        rgba(13,148,136,0.18) 50%,
        rgba(99,102,241,0.22) 100%);
    }
    .lp-overlay-grid {
      position: absolute; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
    }
    .lp-hero-content {
      position: relative;
      z-index: 5;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 24px 80px;
      color: white;
    }
    .lp-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(13,148,136,0.18);
      border: 1px solid rgba(13,148,136,0.4);
      color: #34d399;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 7px 16px;
      border-radius: 999px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 24px;
      backdrop-filter: blur(8px);
      animation: heroEnter 0.8s ease both;
    }
    .lp-badge-dot {
      width: 7px; height: 7px;
      background: #34d399;
      border-radius: 50%;
      animation: pulseGreen 2s ease-in-out infinite;
    }
    @keyframes pulseGreen {
      0%,100% { box-shadow: 0 0 0 0 rgba(52,211,153,0.6); }
      50% { box-shadow: 0 0 0 6px rgba(52,211,153,0); }
    }
    .lp-title {
      font-family: 'Outfit', 'Inter', sans-serif;
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 900;
      line-height: 1.0;
      letter-spacing: -0.04em;
      margin-bottom: 8px;
      animation: heroEnter 0.8s 0.1s ease both;
    }
    .lp-title-gradient {
      background: linear-gradient(135deg, #34d399 0%, #60a5fa 50%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .lp-subtitle {
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      color: rgba(255,255,255,0.72);
      max-width: 600px;
      line-height: 1.65;
      margin-bottom: 8px;
      animation: heroEnter 0.8s 0.2s ease both;
      font-weight: 400;
    }
    .lp-desc {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.5);
      max-width: 480px;
      margin-bottom: 40px;
      animation: heroEnter 0.8s 0.3s ease both;
    }
    .lp-cta-row {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 48px;
      animation: heroEnter 0.8s 0.4s ease both;
    }
    .lp-btn-main {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 15px 32px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .lp-btn-main::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.14) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform 0.5s ease;
    }
    .lp-btn-main:hover::before { transform: translateX(100%); }
    .lp-btn-primary {
      background: linear-gradient(135deg, #0d9488 0%, #6366f1 100%);
      color: white;
      box-shadow: 0 8px 28px rgba(13,148,136,0.4), 0 2px 8px rgba(0,0,0,0.2);
    }
    .lp-btn-primary:hover { transform: translateY(-3px); box-shadow: 0 14px 36px rgba(13,148,136,0.5); }
    .lp-btn-outline {
      background: rgba(255,255,255,0.08);
      color: white;
      border: 1.5px solid rgba(255,255,255,0.28);
      backdrop-filter: blur(12px);
    }
    .lp-btn-outline:hover { background: rgba(255,255,255,0.15); transform: translateY(-3px); }

    /* Stats bar */
    .lp-stats {
      display: flex;
      gap: 40px;
      justify-content: center;
      flex-wrap: wrap;
      animation: heroEnter 0.8s 0.55s ease both;
    }
    .lp-stat { text-align: center; }
    .lp-stat-val {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #34d399, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    .lp-stat-lbl { font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-top: 4px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }

    /* Scroll indicator */
    .lp-scroll {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.4);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      animation: heroEnter 1s 0.9s ease both;
    }
    .lp-scroll-mouse {
      width: 22px; height: 36px;
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 11px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 5px;
    }
    .lp-scroll-wheel {
      width: 3px; height: 8px;
      background: rgba(255,255,255,0.5);
      border-radius: 2px;
      animation: scrollWheel 1.8s ease-in-out infinite;
    }
    @keyframes scrollWheel {
      0%,100% { transform: translateY(0); opacity: 1; }
      80% { transform: translateY(12px); opacity: 0; }
    }

    /* Feature section */
    .lp-features {
      background: #ffffff;
      padding: 96px 24px;
      position: relative;
    }
    .lp-features::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, #0d9488, #6366f1, #f59e0b);
    }
    .lp-section-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, rgba(13,148,136,0.1), rgba(99,102,241,0.1));
      border: 1px solid rgba(13,148,136,0.2);
      color: #0d9488;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .lp-section-title {
      font-family: 'Outfit', 'Inter', sans-serif;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      color: #0f172a;
      line-height: 1.1;
      letter-spacing: -0.04em;
      margin-bottom: 14px;
    }
    .lp-section-sub {
      font-size: 1rem;
      color: #64748b;
      max-width: 560px;
      line-height: 1.65;
    }
    .lp-features-wrap { max-width: 1160px; margin: 0 auto; }
    .lp-features-header { text-align: center; margin-bottom: 60px; }
    .lp-features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
    }
    .lp-feat-card {
      background: linear-gradient(160deg, #f8fafc 0%, #f0fdf9 100%);
      border: 1px solid rgba(203,213,225,0.6);
      border-radius: 20px;
      padding: 28px;
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
      position: relative;
      overflow: hidden;
    }
    .lp-feat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--feat-color, linear-gradient(90deg, #0d9488, #6366f1));
      transform: scaleX(0);
      transition: transform 0.3s ease;
      transform-origin: left;
    }
    .lp-feat-card:hover { transform: translateY(-6px); box-shadow: 0 20px 50px rgba(15,23,42,0.1); border-color: rgba(13,148,136,0.2); }
    .lp-feat-card:hover::before { transform: scaleX(1); }
    .lp-feat-icon {
      width: 56px; height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin-bottom: 18px;
    }
    .lp-feat-title {
      font-family: 'Outfit', 'Inter', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    .lp-feat-desc { font-size: 0.9rem; color: #64748b; line-height: 1.65; }

    /* Roles section */
    .lp-roles {
      background: linear-gradient(145deg, #0f172a 0%, #0d2a25 50%, #1e1b4b 100%);
      padding: 96px 24px;
      position: relative;
      overflow: hidden;
    }
    .lp-roles::before {
      content: '';
      position: absolute;
      top: -100px; right: -100px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(13,148,136,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .lp-roles::after {
      content: '';
      position: absolute;
      bottom: -100px; left: -100px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .lp-roles-wrap { max-width: 1160px; margin: 0 auto; position: relative; z-index: 2; }
    .lp-roles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 52px;
    }
    .lp-role-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 28px;
      text-align: center;
      transition: all 0.22s ease;
      backdrop-filter: blur(10px);
      cursor: pointer;
      text-decoration: none;
      display: block;
    }
    .lp-role-card:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.22);
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .lp-role-emoji { font-size: 2.8rem; margin-bottom: 14px; display: block; }
    .lp-role-name {
      font-family: 'Outfit', 'Inter', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: white;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    .lp-role-desc { font-size: 0.85rem; color: rgba(255,255,255,0.55); line-height: 1.55; }
    .lp-role-arrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 16px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #34d399;
      opacity: 0;
      transform: translateY(4px);
      transition: all 0.2s ease;
    }
    .lp-role-card:hover .lp-role-arrow { opacity: 1; transform: translateY(0); }

    /* Footer strip */
    .lp-footer {
      background: #070d1a;
      padding: 28px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .lp-footer-brand {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      color: white;
      letter-spacing: -0.02em;
    }
    .lp-footer-brand span { color: #34d399; }
    .lp-footer-copy { font-size: 0.78rem; color: rgba(255,255,255,0.35); }
    .lp-footer-sih {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.5);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .lp-sih-badge {
      background: linear-gradient(135deg, #f59e0b, #f97316);
      color: white;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.04em;
    }

    @media (max-width: 640px) {
      .lp-nav { padding: 16px 20px; }
      .lp-nav-links a:not(.btn-nav):not(.btn-nav-primary) { display: none; }
      .lp-hero-content { padding: 100px 20px 60px; }
      .lp-stats { gap: 24px; }
      .lp-stat-val { font-size: 1.4rem; }
      .lp-features { padding: 64px 20px; }
      .lp-roles { padding: 64px 20px; }
      .lp-footer { flex-direction: column; align-items: flex-start; padding: 24px 20px; }
    }
  </style>
</head>

                <div class="lp-role-name">Worker</div>
                <p class="lp-role-desc">Showcase your skills, apply for local jobs, earn fair wages, and build your reputation with reviews.</p>
                <span class="lp-role-arrow">Join now →</span>
              </a>
              <a href="/register.html" class="lp-role-card">
                <span class="lp-role-emoji">👥</span>
                <div class="lp-role-name">Service Team</div>
                <p class="lp-role-desc">Register your team, manage group jobs, coordinate multiple workers, and scale your service business.</p>
                <span class="lp-role-arrow">Register team →</span>
              </a>
              <a href="/register.html" class="lp-role-card">
                <span class="lp-role-emoji">🏪</span>
                <div class="lp-role-name">Small Business</div>

      /* Slideshow */
      const images = [
        'https://images.unsplash.com/photo-1504148455328-c376907d081c?auto=format&fit=crop&w=2400&q=85',
        'https://images.unsplash.com/photo-1589939705384-5185137a7f0f?auto=format&fit=crop&w=2400&q=85',
        'https://images.unsplash.com/photo-1607472586893-edb57bdc0e39?auto=format&fit=crop&w=2400&q=85',
        'https://images.unsplash.com/photo-1556911220-bff31c812dba?auto=format&fit=crop&w=2400&q=85'
      ];
      images.forEach((src, i) => {
        const el = document.getElementById('slide' + i);
        if (el) el.style.backgroundImage = `url("${src}")`;
      });
      const slides = document.querySelectorAll('.lp-slide');
      let cur = 0;
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches && slides.length > 1) {
        setInterval(() => {
          slides[cur].classList.remove('active');
          cur = (cur + 1) % slides.length;
          slides[cur].classList.add('active');
        }, 5500);
      }

      /* Smooth scroll for anchor links */
      document.querySelectorAll('a[href^="#"]').forEach(a => {
        a.addEventListener('click', e => {
          const target = document.querySelector(a.getAttribute('href'));
          if (target) { e.preventDefault(); target.scrollIntoView({ behavior: 'smooth' }); }
        });
      });
    })();
  </script>

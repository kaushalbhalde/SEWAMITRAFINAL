<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEWAMITRA - Connecting Customers & Workers</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div id="landing"></div>
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/app.js"></script>
  <script>
    (async function() {
      const auth = await checkAuth();
      if (auth.user) {
        window.location.href = getDashboardUrl(auth.user.role);
        return;
      }
      document.getElementById('landing').innerHTML = `
        <div class="landing-page">
          <div class="landing-slideshow" aria-hidden="true">
            <div class="landing-slide is-active" data-image="https://images.unsplash.com/photo-1504148455328-c376907d081c?auto=format&fit=crop&w=2400&q=90" data-profession="Carpenter"></div>
            <div class="landing-slide" data-image="https://images.unsplash.com/photo-1589939705384-5185137a7f0f?auto=format&fit=crop&w=2400&q=90" data-profession="Painter"></div>
            <div class="landing-slide" data-image="https://images.unsplash.com/photo-1607472586893-edb57bdc0e39?auto=format&fit=crop&w=2400&q=90" data-profession="Plumber"></div>
            <div class="landing-slide" data-image="https://images.unsplash.com/photo-1556911220-bff31c812dba?auto=format&fit=crop&w=2400&q=90" data-profession="Cook"></div>
          </div>
          ${renderNavbar()}
          ${renderLangBar()}
        <div class="auth-wrap" style="display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:white;padding:40px 20px;">
          <h1 style="font-size:3rem;margin-bottom:12px;">SEWAMITRA<span style="color:var(--accent);">.</span></h1>
          <p style="font-size:1.2rem;margin-bottom:8px;opacity:0.9;">Connecting customers with local workers</p>
          <p style="opacity:0.7;margin-bottom:32px;max-width:500px;">Find trusted workers for any job, or offer your skills to your community. Safe, simple, and local.</p>
          <div style="display:flex;gap:12px;">
            <a href="/login.html" class="btn btn-primary" style="font-size:1rem;padding:14px 32px;">Login</a>
            <a href="/register.html" class="btn btn-secondary" style="font-size:1rem;padding:14px 32px;">Get Started</a>
          </div>
          <div style="margin-top:48px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px;max-width:800px;">
            <div style="text-align:center;">
              <div style="font-size:2.5rem;margin-bottom:8px;">🔧</div>
              <h3 style="margin-bottom:4px;">Any Job, Any Skill</h3>
              <p style="font-size:0.85rem;opacity:0.7;">From plumbing to tutoring, find the right person.</p>
            </div>
            <div style="text-align:center;">
              <div style="font-size:2.5rem;margin-bottom:8px;">🛡️</div>
              <h3 style="margin-bottom:4px;">Safe & Verified</h3>
              <p style="font-size:0.85rem;opacity:0.7;">ID verification, SOS button, and dispute resolution.</p>
            </div>
            <div style="text-align:center;">
              <div style="font-size:2.5rem;margin-bottom:8px;">💰</div>
              <h3 style="margin-bottom:4px;">Fair Payment</h3>
              <p style="font-size:0.85rem;opacity:0.7;">Negotiate rates, pay through held balance, release on completion.</p>
            </div>
            <div style="text-align:center;">
              <div style="font-size:2.5rem;margin-bottom:8px;">🏪</div>
              <h3 style="margin-bottom:4px;">Local Marketplace</h3>
              <p style="font-size:0.85rem;opacity:0.7;">Businesses can sell products and services.</p>
            </div>
          </div>
        </div>
        </div>
      `;

      const slides = [...document.querySelectorAll('.landing-slide')];
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let currentSlide = 0;
      let slideshowTimer;

      const preloadSlide = slide => new Promise(resolve => {
        const image = new Image();
        image.onload = () => {
          slide.style.backgroundImage = `url("${slide.dataset.image}")`;
          resolve();
        };
        image.onerror = resolve;
        image.src = slide.dataset.image;
      });

      const showNextSlide = () => {
        slides[currentSlide].classList.remove('is-active');
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add('is-active');
      };

      const startSlideshow = () => {
        if (reducedMotion || slideshowTimer || slides.length < 2) return;
        slideshowTimer = window.setInterval(showNextSlide, 5500);
      };

      const stopSlideshow = () => {
        window.clearInterval(slideshowTimer);
        slideshowTimer = undefined;
      };

      Promise.all(slides.map(preloadSlide)).then(startSlideshow);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) stopSlideshow();
        else startSlideshow();
      });
    })();
  </script>
</body>
</html>
